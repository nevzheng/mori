[package]
name = "mori-cli"
description = "The mori command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anstyle.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
mori-api = { path = "../api" }
mori-app = { path = "../app" }
mori-core = { path = "../core" }
mori-git = { path = "../git" }
mori-github = { path = "../github" }
mori-jj = { path = "../jj" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# `cargo binstall` fetches the archive the release workflow attaches, named after the binary
# rather than this crate.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mori-v{ version }-{ target }{ archive-suffix }"
bin-dir = "mori-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "mori"
path = "src/main.rs"
