name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bazel:
    # The supported path: build, clippy, rustfmt and tests in one command.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
      - run: bazel test //...

  cargo:
    # Secondary path: keeps the Cargo manifests building for rust-analyzer and cargo users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    # Line coverage of the unit tests and the e2e scenarios, reported in the run summary. Report
    # only: no threshold fails the build. The e2e runs the instrumented binary outside Bazel.
    runs-on: ubuntu-latest
    env:
      JJ_VERSION: 0.45.1
      JJ_SHA256: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.94.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Pinned jj (same release and checksum as MODULE.bazel)
        run: |
          set -euo pipefail
          tarball="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/$tarball"
          echo "$JJ_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jj"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/jj"
          echo "MORI_TEST_JJ=$RUNNER_TEMP/jj/jj" >> "$GITHUB_ENV"
      - name: Tests, instrumented
        run: |
          set -euo pipefail
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo test --workspace
          cargo build -p mori-cli
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" -r e2e/requirements_lock.txt
          MORI_BIN=target/debug/mori "$RUNNER_TEMP/venv/bin/python" e2e/pytest_main.py
      - name: Report
        run: |
          set -euo pipefail
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov report --ignore-filename-regex 'crates/api/src/gen/' > coverage.txt
          cat coverage.txt
          {
            echo '## Line coverage (unit + e2e)'
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  markdown:
    # Markdown is linted and formatted by rumdl (.rumdl.toml): 100 columns, aligned tables.
    # The job always runs so this required check always reports; its lint steps skip when a
    # change touches no Markdown (a workflow-level path filter would leave the check pending).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did Markdown change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No usable base (a new branch, a force-push): check everything.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '\.md$|^\.rumdl\.toml$|^\.github/workflows/ci\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Markdown changed; skipping the lint."
          fi
      - name: Lint
        if: steps.changed.outputs.run == 'true'
        uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb # v0.2.77
        with:
          version: 0.2.77
          command: check
      - name: Check formatting
        if: steps.changed.outputs.run == 'true'
        uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb # v0.2.77
        with:
          version: 0.2.77
          command: fmt-check
