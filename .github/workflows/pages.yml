name: pages

# Builds the website from docs/ with Zensical. Pull requests that touch it get a build check;
# main publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["docs/**", "zensical.toml", "README.md", "CONTRIBUTING.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "zensical.toml", "README.md", "CONTRIBUTING.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --user zensical==0.0.65
      - run: python3 -m zensical build --clean --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
