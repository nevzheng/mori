name: release

# The release channel (docs/releases.md). Merging a release PR, which sets a version without -dev
# in Cargo.toml and version.bzl, releases it: this workflow builds mori for macOS and Linux,
# attaches the archives and their checksums to a draft, and publishes it, which creates the tag
# vX.Y.Z on the merge commit. Pushing such a tag by hand does the same. A pull request that changes
# this workflow or the version, or a run by hand, builds the archives without releasing anything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "version.bzl", "Cargo.toml", "CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: read

# A tag's runs queue rather than race for the same release. Branch pushes are grouped per commit:
# GitHub keeps only one pending run per group, so a shared group for main would let the next merge
# (say, the bump back to -dev) cancel a queued release.
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref || github.sha }}
  cancel-in-progress: false

jobs:
  version:
    # A release's version has no -dev suffix, matches the tag, is the same in Cargo.toml and
    # version.bzl, and has a CHANGELOG entry.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          bzl_version=$(sed -n 's/^MORI_VERSION = "\([^"]*\)"/\1/p' version.bzl)
          if [[ "$cargo_version" != "$bzl_version" ]]; then
            echo "::error::Cargo.toml says $cargo_version but version.bzl says $bzl_version"
            exit 1
          fi
          release=false
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" != "v$cargo_version" ]]; then
              echo "::error::tag $TAG doesn't match version $cargo_version"
              exit 1
            fi
            if [[ "$cargo_version" == *-dev ]]; then
              echo "::error::$cargo_version is a head version; a release drops -dev"
              exit 1
            fi
            release=true
          elif [[ "$EVENT" == push && "$cargo_version" != *-dev ]]; then
            # A release PR just merged, unless this version was already released.
            if [[ -z "$(git ls-remote --tags origin "refs/tags/v$cargo_version")" ]]; then
              release=true
            fi
          fi
          if [[ "$cargo_version" != *-dev ]] && ! grep -q "^## $cargo_version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $cargo_version"
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Every push to main runs this workflow, but only a release needs the archives.
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: mori-v${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p mori-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/mori" LICENSE README.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.tar.gz*

  release:
    # Draft first, so every archive is attached before publishing locks the release (immutable
    # releases); then publish, which creates the tag on this commit if it doesn't exist yet.
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The notes are the version's CHANGELOG entry, reviewed in the release PR.
          awk -v heading="## $VERSION " 'index($0, heading) == 1 {found = 1; next}
            /^## / {found = 0} found' CHANGELOG.md > notes.md
          # A version with a suffix (0.1.0-alpha.1) is a pre-release.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # A re-run after a failed publish finds its own draft: refresh its files instead.
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft \
            2>/dev/null)" == true ]]; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft "${prerelease[@]}" --title "mori $tag" --notes-file notes.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
