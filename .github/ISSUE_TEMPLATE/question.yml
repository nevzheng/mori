name: Question
description: Ask how to do something, or whether mori supports it.
title: "question: "
labels: ["kind/question", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        mori is a hobby project, so answers come when they can. Security issues don't belong here:
        see SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mori version
      description: Output of `mori --version`, if it's relevant.
    validations:
      required: false
