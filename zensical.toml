# The website (https://nevzheng.github.io/mori/), built with Zensical from docs/.
# Build locally: `uvx zensical==0.0.65 build` (output in site/) or `uvx zensical==0.0.65 serve`.

[project]
site_name = "mori"
site_description = "memento mori: every tree dies; your work doesn't."
site_url = "https://nevzheng.github.io/mori/"
repo_url = "https://github.com/nevzheng/mori"
repo_name = "nevzheng/mori"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/everforest.css"]
nav = [
  { "Home" = "index.md" },
  { "Contributing" = "contributing.md" },
  { "Brand" = "brand.md" },
  { "Design docs" = [
    { "How design docs work" = "design/README.md" },
    { "Template" = "design/TEMPLATE.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Light and dark follow the OS; the header toggle overrides it. Colours: docs/stylesheets.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
