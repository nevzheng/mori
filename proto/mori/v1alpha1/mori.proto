syntax = "proto3";

// mori's API. Alpha: no stability guarantees; anything may change in any release (AIP-185).
// Everything else (Rust types, JSON output, MCP tool schemas) is generated from this package.
package mori.v1alpha1;

// mori's operations.
service MoriService {
  // Sets up mori once per machine: the root layout, the config and the state store.
  // Only ever adds things; running it again changes nothing.
  rpc Init(InitRequest) returns (InitResponse);

  // Clones a repo to repos/<host>/<owner>/<repo> and records it with a pinned base tree.
  // Refuses a repo mori already has and any path it didn't make. If the clone succeeds but
  // recording it fails, the clone is kept and the error says so.
  rpc Clone(CloneRequest) returns (CloneResponse);
}

// Request for `Init`.
message InitRequest {
  // Report what would be created without creating anything (AIP-163; the CLI's --dry-run).
  bool validate_only = 1;
}

// Response for `Init`.
message InitResponse {
  // Absolute path of the root.
  string root = 1;

  // True if mori was already set up and nothing changed.
  bool already_initialized = 2;

  // Echoes the request: true if nothing was actually created.
  bool validate_only = 3;

  // What was created, or would be created when `validate_only` is set.
  repeated CreatedPath created = 4;

  // Clones found under the root that mori didn't make. mori never touches them.
  repeated UnmanagedRepo unmanaged_repos = 5;
}

// A path `Init` created.
message CreatedPath {
  // What kind of path it is.
  enum Kind {
    // Not set.
    KIND_UNSPECIFIED = 0;
    // A directory.
    KIND_DIRECTORY = 1;
    // A regular file.
    KIND_FILE = 2;
  }

  // Absolute path.
  string path = 1;

  // Directory or file.
  Kind kind = 2;
}

// A clone under the root that mori didn't make.
message UnmanagedRepo {
  // The repo's identity, e.g. "github.com/acme/widget".
  string repo = 1;

  // Absolute path of the clone.
  string path = 2;
}

// Request for `Clone`.
message CloneRequest {
  // What to clone: https://, ssh://, user@host:owner/repo, or host/owner/repo.
  string url = 1;

  // Report what would happen without cloning anything (AIP-163; the CLI's --dry-run).
  bool validate_only = 2;

  // Make a jj-only clone. By default the clone is colocated: a jj repo and a git repo at once.
  bool jj_only = 3;
}

// Response for `Clone`.
message CloneResponse {
  // The repo's identity, all lowercase, e.g. "github.com/acme/widget".
  string repo = 1;

  // Absolute path of the clone.
  string path = 2;

  // The URL fetched from.
  string fetch_url = 3;

  // True if the clone is also a git repo.
  bool colocated = 4;

  // The repo's directory under trees/, where its task trees will go.
  string tree_dir = 5;

  // Echoes the request: true if nothing was actually cloned.
  bool validate_only = 6;
}
