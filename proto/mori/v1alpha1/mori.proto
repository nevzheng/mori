syntax = "proto3";

// mori's API. Alpha: no stability guarantees; anything may change in any release (AIP-185).
// Everything else (Rust types, JSON output, MCP tool schemas) is generated from this package.
package mori.v1alpha1;

// mori's operations.
service MoriService {
  // Sets up mori once per machine: the root layout, the config and the state store.
  // Only ever adds things; running it again changes nothing.
  rpc Init(InitRequest) returns (InitResponse);

  // Clones a repo to repos/<host>/<owner>/<repo> and records it with a pinned base tree.
  // Refuses a repo mori already has and any path it didn't make. If the clone succeeds but
  // recording it fails, the clone is kept and the error says so.
  rpc Clone(CloneRequest) returns (CloneResponse);

  // Gives one piece of work its own task tree: a jj workspace at trees/<repo dir>/<name>, on a
  // new change on top of `from`, recorded with its owner, task and lifetime. If the workspace is
  // made but recording it fails, the workspace is kept and the error says so.
  rpc CreateTree(CreateTreeRequest) returns (CreateTreeResponse);

  // Lists the repos mori manages and their trees, with each tree's state read from the VCS
  // without snapshotting. Records and workspaces that don't match are rows, never errors.
  rpc ListTrees(ListTreesRequest) returns (ListTreesResponse);

  // Removes a task tree mori made, only when nothing in it exists only on this machine (no edits,
  // no change missing from the remote). Snapshots the tree first. Never removes the clone itself
  // or a workspace mori didn't make.
  rpc RemoveTree(RemoveTreeRequest) returns (RemoveTreeResponse);

  // Brings mori's agent skills in the root up to date with this mori, and regenerates the
  // skills/llms.txt and llms.txt indexes. Changes only files mori wrote and nobody edited since;
  // never touches anyone else's skills.
  rpc SyncSkills(SyncSkillsRequest) returns (SyncSkillsResponse);

  // Reports which trees may be removed and whether each is safe to remove; fetches remote
  // bookmarks unless offline. With `apply` and `confirmed`, also removes a batch of the removable
  // ones: each is snapshotted and judged again first and kept if anything changed; each removal
  // pins the tree's commit and goes into the journal, so `Restore` can bring it back.
  rpc Gc(GcRequest) returns (GcResponse);

  // Brings back a tree `Gc` removed, from its journal entry: its workspace on the pinned
  // commit, at its old path, recorded under its old ID. Says so if the commit is gone.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
}

// Request for `Init`.
message InitRequest {
  // Report what would be created without creating anything (AIP-163; the CLI's --dry-run).
  bool validate_only = 1;
}

// Response for `Init`.
message InitResponse {
  // Absolute path of the root.
  string root = 1;

  // True if mori was already set up and nothing changed.
  bool already_initialized = 2;

  // Echoes the request: true if nothing was actually created.
  bool validate_only = 3;

  // What was created, or would be created when `validate_only` is set.
  repeated CreatedPath created = 4;

  // Clones found under the root that mori didn't make. mori never touches them.
  repeated UnmanagedRepo unmanaged_repos = 5;
}

// A path `Init` created.
message CreatedPath {
  // What kind of path it is.
  enum Kind {
    // Not set.
    KIND_UNSPECIFIED = 0;
    // A directory.
    KIND_DIRECTORY = 1;
    // A regular file.
    KIND_FILE = 2;
  }

  // Absolute path.
  string path = 1;

  // Directory or file.
  Kind kind = 2;
}

// A clone under the root that mori didn't make.
message UnmanagedRepo {
  // The repo's identity, e.g. "github.com/acme/widget".
  string repo = 1;

  // Absolute path of the clone.
  string path = 2;
}

// Request for `Clone`.
message CloneRequest {
  // What to clone: https://, ssh://, user@host:owner/repo, or host/owner/repo.
  string url = 1;

  // Report what would happen without cloning anything (AIP-163; the CLI's --dry-run).
  bool validate_only = 2;

  // Make a jj-only clone. By default the clone is colocated: a jj repo and a git repo at once.
  bool jj_only = 3;
}

// Response for `Clone`.
message CloneResponse {
  // The repo's identity, all lowercase, e.g. "github.com/acme/widget".
  string repo = 1;

  // Absolute path of the clone.
  string path = 2;

  // The URL fetched from.
  string fetch_url = 3;

  // True if the clone is also a git repo.
  bool colocated = 4;

  // The repo's directory under trees/, where its task trees will go.
  string tree_dir = 5;

  // Echoes the request: true if nothing was actually cloned.
  bool validate_only = 6;
}

// A tree mori created.
message Tree {
  // Opaque and stable; never reused. Empty when nothing was created (a dry run).
  string id = 1;

  // The repo's identity, e.g. "github.com/acme/widget".
  string repo = 2;

  // The tree's name, which is also its workspace name, e.g. "claude-fix-login".
  string name = 3;

  // Absolute path of the tree.
  string path = 4;

  // The role was dropped: the base tree is the clone's own workspace, "default".
  reserved 5;
  reserved "role";

  // Who the tree is for: an agent such as "claude", or a person's login name.
  string owner = 6;

  // The task, e.g. "fix-login". Empty for the base tree.
  string task = 7;

  // When the tree may go: "pinned", "task-done", "lru", or "ttl:<n>d" / "ttl:<n>h".
  string lifetime = 8;
}

// Request for `CreateTree`.
message CreateTreeRequest {
  // The repo, in any form `Clone` accepts.
  string repo = 1;

  // A short slug for the work: lowercase letters, digits and hyphens.
  string task = 2;

  // Who the tree is for. Defaults to the login name.
  string agent = 3;

  // A lifetime instead of the configured default for task trees.
  string lifetime = 4;

  // The jj revision the tree starts from. Defaults to "trunk()".
  string from = 5;

  // Report what would happen without creating anything (AIP-163; the CLI's --dry-run).
  bool validate_only = 6;
}

// Response for `CreateTree`.
message CreateTreeResponse {
  // The tree created, or that would be created.
  Tree tree = 1;

  // The revision it starts from.
  string from = 2;

  // Echoes the request: true if nothing was actually created.
  bool validate_only = 3;
}

// Request for `ListTrees`.
message ListTreesRequest {
  // Only this repo, in any form `Clone` accepts. Empty for every repo mori manages.
  string repo = 1;
}

// Response for `ListTrees`.
message ListTreesResponse {
  // The repos mori manages, sorted by identity.
  repeated RepoTrees repos = 1;

  // Clones under the root that mori didn't make. Listed only when no repo was asked for.
  repeated UnmanagedRepo unmanaged_repos = 2;
}

// One repo mori manages, and its trees.
message RepoTrees {
  // The repo's identity, e.g. "github.com/acme/widget".
  string repo = 1;

  // Absolute path of the clone.
  string path = 2;

  // Every tree mori recorded and every workspace the VCS reports, sorted by name.
  repeated TreeRow trees = 3;
}

// One tree, as mori recorded it and as the VCS reports it.
message TreeRow {
  // How mori's record and the VCS match.
  enum Status {
    // Not set.
    STATUS_UNSPECIFIED = 0;
    // Recorded by mori, and the VCS has its workspace.
    STATUS_TREE = 1;
    // Recorded by mori, but the VCS has no workspace of that name.
    STATUS_MISSING = 2;
    // The VCS has the workspace, but mori didn't make it. mori leaves it alone.
    STATUS_FOREIGN = 3;
  }

  // The tree. A foreign tree has only its name and path.
  Tree tree = 1;

  // How the record and the VCS match.
  Status status = 2;

  // The VCS state; unset for a missing tree.
  TreeState state = 3;

  // The bookmarks mori has seen pushed from the tree (task trees only), and whether each landed.
  repeated PushedBookmark bookmarks = 4;
}

// A bookmark mori saw pushed from a tree.
message PushedBookmark {
  // The remote, e.g. "origin".
  string remote = 1;

  // The bookmark, e.g. "claude/fix-login".
  string name = 2;

  // Where it pointed when mori last saw it.
  string commit_id = 3;

  // Whether the remote still has it, as far as the clone knows.
  bool on_remote = 4;

  // Whether its work landed: it is gone from the remote after being pushed (as after a squash
  // merge). `ls` doesn't ask GitHub, so a merged pull request whose bookmark still exists shows as
  // not landed here.
  bool landed = 5;
}

// A tree's state as of the VCS's last snapshot of it.
message TreeState {
  // The working-copy change's short ID.
  string change = 1;

  // True if the working-copy change has edits.
  bool changed = 2;

  // Non-empty changes on no remote bookmark and not in trunk: work only this machine has.
  uint32 unpushed = 3;
}

// Request for `RemoveTree`.
message RemoveTreeRequest {
  // The repo, in any form `Clone` accepts.
  string repo = 1;

  // The tree's name, e.g. "claude-fix-login".
  string name = 2;

  // Who is asking; must be the tree's owner. Defaults to the login name.
  string agent = 3;

  // Allow removing a pinned tree.
  bool pinned = 4;

  // Check everything and remove nothing (AIP-163; the CLI's --dry-run). The tree is still
  // snapshotted, which changes only jj's record of it.
  bool validate_only = 5;
}

// Response for `RemoveTree`.
message RemoveTreeResponse {
  // The tree removed, or that would be removed.
  Tree tree = 1;

  // True if its workspace was forgotten (false for a missing tree).
  bool workspace_forgotten = 2;

  // True if its directory was deleted. A missing tree's directory is left in place.
  bool directory_removed = 3;

  // Echoes the request: true if nothing was actually removed.
  bool validate_only = 4;
}

// Request for `SyncSkills`.
message SyncSkillsRequest {
  // Report what would change without writing anything (AIP-163; the CLI's --dry-run).
  bool validate_only = 1;
}

// Response for `SyncSkills`.
message SyncSkillsResponse {
  // Every file mori ships into the root: its skills and the two indexes.
  repeated SkillFile files = 1;

  // Echoes the request: true if nothing was actually written.
  bool validate_only = 2;
}

// One file mori ships into the root, and what a sync did with it.
message SkillFile {
  // What happened to the file.
  enum Action {
    // Not set.
    ACTION_UNSPECIFIED = 0;
    // It wasn't there, so mori wrote it.
    ACTION_INSTALLED = 1;
    // It already matched this mori's version.
    ACTION_UNCHANGED = 2;
    // mori wrote it before and nobody changed it, so mori updated it.
    ACTION_UPDATED = 3;
    // mori wrote it before, but someone edited it, so mori kept their version.
    ACTION_KEPT_EDITED = 4;
    // It is there, but mori never wrote it, so mori left it alone.
    ACTION_SKIPPED_NOT_OURS = 5;
  }

  // Absolute path of the file.
  string path = 1;

  // What happened to it.
  Action action = 2;
}

// Request for `Gc`.
message GcRequest {
  // Only this repo, in any form `Clone` accepts. Empty for every repo mori manages.
  string repo = 1;

  // Don't fetch or ask GitHub: work only from what the clone already knows.
  bool offline = 2;

  // Also remove a batch of the trees the report finds removable.
  bool apply = 3;

  // The person confirmed the removal. With `apply` and without it, nothing is removed.
  bool confirmed = 4;

  // With `apply`: only these trees, by name. Empty for every removable tree.
  repeated string names = 5;

  // With `apply`: the most trees to remove. 0 means the default, 10.
  uint32 max = 6;

  // With `apply`: check everything and remove nothing (AIP-163; the CLI's --dry-run).
  bool validate_only = 7;
}

// Response for `Gc`.
message GcResponse {
  reserved 1;
  reserved "report_id";

  // Every tree, sorted by repo and name.
  repeated GcItem items = 2;

  // Echoes the request: true if nothing was removed although `apply` was asked.
  bool validate_only = 3;
}

// One tree in a cleanup report.
message GcItem {
  // What cleanup does with it.
  enum Class {
    // Not set.
    CLASS_UNSPECIFIED = 0;
    // It may go, and nothing would be lost.
    CLASS_REMOVE = 1;
    // It may go, but it has work only this machine has.
    CLASS_BLOCKED = 2;
    // Its lifetime doesn't let it go yet.
    CLASS_KEEP = 3;
    // Cleanup never removes it.
    CLASS_NEVER = 4;
  }

  // The repo, e.g. "github.com/acme/widget".
  string repo = 1;

  // The tree's name.
  string name = 2;

  // Absolute path of the tree.
  string path = 3;

  // What cleanup does with it.
  Class class = 4;

  // Why, e.g. "LANDED", "UNSAVED", "PINNED".
  string reason = 5;

  // The facts it was judged on, for people to read.
  string facts = 6;

  // What `apply` did with the tree. Unset when nothing was applied to it.
  enum Outcome {
    // Not applied.
    OUTCOME_UNSPECIFIED = 0;
    // Removed and journalled.
    OUTCOME_REMOVED = 1;
    // Would be removed (a dry run).
    OUTCOME_WOULD_REMOVE = 2;
    // Checked again, it may no longer go (its facts changed); kept.
    OUTCOME_SKIPPED_CHANGED = 3;
    // Checked again, it has work only this machine has; kept.
    OUTCOME_SKIPPED_UNSAVED = 4;
  }

  // What `apply` did with it.
  Outcome outcome = 7;

  // The journal entry for a removal, for `Restore`.
  string entry_id = 8;
}

// Request for `Restore`.
message RestoreRequest {
  // The journal entry, from `Gc` with `apply`.
  string entry_id = 1;
}

// Response for `Restore`.
message RestoreResponse {
  // The tree, back under its old ID.
  Tree tree = 1;

  // The commit it was restored on.
  string commit_id = 2;
}
