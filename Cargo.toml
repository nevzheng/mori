[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/nevzheng/mori"
publish = false

# Shared third-party versions. prost, pbjson and protox must agree on prost 0.14.
[workspace.dependencies]
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"  # a safety tool must not panic on bad input
panic = "deny"
todo = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stdout = "warn" # output goes through one output layer (JSON or human)
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
